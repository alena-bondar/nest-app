services:
  backend:
    build: .
    ports:
      - "5000:5000"
    depends_on:
          - postgres
    env_file:
          - .env

  postgres:
    image: postgres:17
    restart: on-failure
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=prisma
    ports:
        - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data